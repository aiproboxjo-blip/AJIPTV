
name: AJIPTV Build - FFmpeg

on:
  workflow_dispatch:
  push:
    paths:
      - "project.zip"
      - ".github/workflows/build-ffmpeg.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e
          test -f project.zip || {
            echo "ERROR: project.zip not found"
            exit 1
          }
          unzip -o project.zip
          test -f ci-build.sh || {
            echo "ERROR: ci-build.sh not found after extraction"
            exit 1
          }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build project
        shell: bash
        run: |
          chmod +x ci-build.sh
          set -o pipefail
          ./ci-build.sh 2>&1 | tee build-ffmpeg.log

      - name: Find generated APKs
        if: always()
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload application APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AJIPTV-FFmpeg-APK
          path: |
            app/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AJIPTV-Build-Log
          path: build-ffmpeg.log
          if-no-files-found: warn
          retention-days: 7
