name: AJIPTV Build with FFmpeg + VLC

on:
  workflow_dispatch:
  push:
    paths:
      - "project.zip"
      - ".github/workflows/build-ffmpeg.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f project.zip || { echo "project.zip is missing"; exit 1; }
          unzip -o project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build one APK containing ExoPlayer + FFmpeg decoder + VLC engine
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -Pmedia3=1.3.1 \
            -PffVer=1.3.1+1 \
            -PvlcVer=3.7.6

      - name: Upload combined APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AJIPTV-FFmpeg-VLC-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
