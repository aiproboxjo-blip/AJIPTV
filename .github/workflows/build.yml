name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o project.zip

      - name: Force Enable Audio Codecs
        shell: bash
        run: |
          python3 -c "
          import os

          # 1. Enable FFmpeg directly in app/build.gradle.kts without conditions
          gradle_path = 'app/build.gradle.kts'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r', encoding='utf-8') as f:
                  g = f.read()
              g = g.replace('if (ffVer != null)', '//')
              g = g.replace('if (vlcVer != null)', '//')
              if 'media3-ffmpeg-decoder' not in g:
                  g += '\n\ndependencies {\n    implementation(\"org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+1\")\n}\n'
              if 'useLegacyPackaging' not in g:
                  g += '\nandroid {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n}\n'
              with open(gradle_path, 'w', encoding='utf-8') as f:
                  f.write(g)
              print('✓ Enabled FFmpeg unconditionally')

          # 2. Extract Native Libs for TV Box
          manifest_path = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  m = f.read()
              if 'android:extractNativeLibs' not in m:
                  m = m.replace('<application', '<application\n        android:extractNativeLibs=\"true\"')
                  with open(manifest_path, 'w', encoding='utf-8') as f:
                      f.write(m)
                  print('✓ Extracted native libs')
          "

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ajiptv.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ajiptv.p12" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ci-build.sh

      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk AJIPTV.apk
          cp admin/build/outputs/apk/debug/admin-debug.apk AJIPTV-Admin.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: AJIPTV-apk
          path: AJIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AJIPTV-Admin-apk
          path: AJIPTV-Admin.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AJIPTV v${{ github.run_number }}
          files: AJIPTV.apk
          make_latest: true
