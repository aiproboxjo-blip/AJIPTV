name: Build APK (FFmpeg fallback)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -o project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ajiptv.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ajiptv.p12" >> "$GITHUB_ENV"
          fi

      - name: Build with FFmpeg / VLC compatibility attempts
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ci-build.sh

      - name: Collect APK files
        if: always()
        shell: bash
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk AJIPTV.apk
          fi
          if [ -f admin/build/outputs/apk/debug/admin-debug.apk ]; then
            cp admin/build/outputs/apk/debug/admin-debug.apk AJIPTV-Admin.apk
          fi
          ls -l AJIPTV.apk AJIPTV-Admin.apk 2>/dev/null || true

      - name: Upload APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AJIPTV-apks
          path: |
            AJIPTV.apk
            AJIPTV-Admin.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Publish release
        if: success() && hashFiles('AJIPTV.apk') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AJIPTV v${{ github.run_number }}
          files: |
            AJIPTV.apk
            AJIPTV-Admin.apk
          make_latest: true
