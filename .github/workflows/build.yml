name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o project.zip
      - name: Fix FFmpeg Audio on TV Box
        shell: bash
        run: |
          python3 -c "
          import os

          # 1. Force extractNativeLibs for Android TV Box
          manifest_path = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  m = f.read()
              m = m.replace('android:extractNativeLibs=\"false\"', 'android:extractNativeLibs=\"true\"')
              if 'android:extractNativeLibs' not in m:
                  m = m.replace('<application', '<application\n        android:extractNativeLibs=\"true\"')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(m)
              print('✓ Fixed AndroidManifest.xml')

          # 2. Force legacy packaging to package libffmpegJNI.so properly
          gradle_path = 'app/build.gradle.kts'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r', encoding='utf-8') as f:
                  g = f.read()
              if 'useLegacyPackaging' not in g:
                  g = g.replace('android {', 'android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }')
              g = g.replace('media3-ffmpeg-decoder:1.3.1+1', 'media3-ffmpeg-decoder:1.3.1+2')
              with open(gradle_path, 'w', encoding='utf-8') as f:
                  f.write(g)
              print('✓ Fixed app/build.gradle.kts')

          # 3. Force FFmpeg PREFER and remove audio track filters
          player_path = 'app/src/main/java/com/aj/iptv/player/AjPlayer.kt'
          if os.path.exists(player_path):
              with open(player_path, 'r', encoding='utf-8') as f:
                  p = f.read()
              p = p.replace('EXTENSION_RENDERER_MODE_ON', 'EXTENSION_RENDERER_MODE_PREFER')
              p = p.replace('ffPrefer: Boolean = false', 'ffPrefer: Boolean = true')
              p = p.replace('.setPreferredAudioMimeTypes(MimeTypes.AUDIO_AAC, MimeTypes.AUDIO_MPEG)', '')
              with open(player_path, 'w', encoding='utf-8') as f:
                  f.write(p)
              print('✓ Fixed AjPlayer.kt')
          "
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ajiptv.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ajiptv.p12" >> "$GITHUB_ENV"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ci-build.sh
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk AJIPTV.apk
          cp admin/build/outputs/apk/debug/admin-debug.apk AJIPTV-Admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AJIPTV-apk
          path: AJIPTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AJIPTV-Admin-apk
          path: AJIPTV-Admin.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AJIPTV v${{ github.run_number }}
          files: AJIPTV.apk
          make_latest: true
