name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o project.zip

      - name: Patch VLC, ExoPlayer Audio & Settings
        shell: bash
        run: |
          python3 -c "
          import os

          # 1. Add VideoLAN Repo
          settings_path = 'settings.gradle.kts'
          if os.path.exists(settings_path):
              with open(settings_path, 'r', encoding='utf-8') as f:
                  s = f.read()
              if 'videolan' not in s:
                  s = s.replace('mavenCentral()', 'mavenCentral()\n        maven { url = java.net.URI(\"https://videolan.org\") }')
                  with open(settings_path, 'w', encoding='utf-8') as f:
                      f.write(s)
                  print('✓ Added VideoLAN repo')

          # 2. Patch build.gradle to add FFmpeg Software Audio Decoder for ExoPlayer
          build_gradle_path = 'app/build.gradle'
          if os.path.exists(build_gradle_path):
              with open(build_gradle_path, 'r', encoding='utf-8') as f:
                  bg = f.read()
              if 'media3-ffmpeg-decoder' not in bg and 'extension-ffmpeg' not in bg:
                  bg = bg.replace('dependencies {', 'dependencies {\n    implementation \"org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+2\"')
                  with open(build_gradle_path, 'w', encoding='utf-8') as f:
                      f.write(bg)
                  print('✓ Added FFmpeg decoder dependency to build.gradle')

          # 3. Force Global Software Decoding Priority in AjPlayer.kt
          player_path = 'app/src/main/java/com/aj/iptv/player/AjPlayer.kt'
          if os.path.exists(player_path):
              with open(player_path, 'r', encoding='utf-8') as f:
                  p = f.read()
              if 'DefaultRenderersFactory' not in p:
                  p = p.replace('ExoPlayer.Builder(this)', 'ExoPlayer.Builder(this, androidx.media3.exoplayer.DefaultRenderersFactory(this).setExtensionRendererMode(androidx.media3.exoplayer.DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER))')
                  p = p.replace('ExoPlayer.Builder(context)', 'ExoPlayer.Builder(context, androidx.media3.exoplayer.DefaultRenderersFactory(context).setExtensionRendererMode(androidx.media3.exoplayer.DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER))')
                  print('✓ Force injected FFmpeg extension into Player Builders')

              p = p.replace('if (prefs.getInt(\"engine\", 0) == 2 && VlcBridge.available()) { openVlc(); return }', 'if (VlcBridge.available() && prefs.getInt(\"engine\", 0) != 1 && (!live || prefs.getInt(\"engine\", 0) == 2)) { openVlc(); return }')
              with open(player_path, 'w', encoding='utf-8') as f:
                  f.write(p)

          # 4. Patch VlcActivity.kt (الموازنة الصحيحة بين هاردوير الفيديو وسوفتوير الصوت)
          vlc_path = 'app/src/vlc/java/com/aj/iptv/player/VlcActivity.kt'
          if os.path.exists(vlc_path):
              with open(vlc_path, 'r', encoding='utf-8') as f:
                  v = f.read()
              
              # رفع الكاش لـ 3000ms لمنع التقطيع نهائياً في بث الـ 4K والمباشر وتفعيل أداة تسريع الفريمات المتأخرة
              v = v.replace('arrayListOf(\"--network-caching=1500\", \"--no-drop-late-frames\", \"--no-skip-frames\")', 'arrayListOf(\"--network-caching=3000\", \"--drop-late-frames\", \"--skip-frames\", \"--audio-resampler=soxr\")')
              v = v.replace('arrayListOf(\"--network-caching=600\", \"--drop-late-frames\", \"--skip-frames\", \"--audio-resampler=soxr\", \"--codec=mediacodec_ndk,mediacodec_jni,all\")', 'arrayListOf(\"--network-caching=3000\", \"--drop-late-frames\", \"--skip-frames\", \"--audio-resampler=soxr\")')
              v = v.replace('arrayListOf(\"--network-caching=2000\", \"--drop-late-frames\", \"--skip-frames\", \"--audio-resampler=soxr\", \"--codec=mediacodec_ndk,mediacodec_jni,all\")', 'arrayListOf(\"--network-caching=3000\", \"--drop-late-frames\", \"--skip-frames\", \"--audio-resampler=soxr\")')
              
              # إرجاع وضع الـ HW المدمج والذكي (true, false) لمعالجة الفيديو من كرت الشاشة وتفادي اختفاء الصورة
              v = v.replace('m.setHWDecoderEnabled(false, false)', 'm.setHWDecoderEnabled(true, false)')
              
              v = v.replace('p.setTime((p.time + ms).coerceAtLeast(0L))', 'val t = (p.time + ms).coerceIn(0L, if (p.length > 0) p.length else Long.MAX_VALUE); p.time = t; title.text = \"\${PlayQueue.names.getOrElse(index) { \"\" }} [\" + (if (ms > 0) \"+10s\" else \"-10s\") + \"]\"')
              v = v.replace('if (e.keyCode == KeyEvent.KEYCODE_MENU) { bar.visibility = View.GONE; return true }', 'if (e.keyCode == KeyEvent.KEYCODE_DPAD_LEFT && !live) { seek(-10_000); return true }\n                if (e.keyCode == KeyEvent.KEYCODE_DPAD_RIGHT && !live) { seek(10_000); return true }\n                if (e.keyCode == KeyEvent.KEYCODE_MENU) { bar.visibility = View.GONE; return true }')
              with open(vlc_path, 'w', encoding='utf-8') as f:
                  f.write(v)
              print('✓ Balanced VLC Audio/Video Engines successfully')

          # 5. Ensure VlcActivity is in AndroidManifest.xml
          manifest_path = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  m = f.read()
              if 'VlcActivity' not in m:
                  m = m.replace('</application>', '    <activity android:name=\".player.VlcActivity\" android:exported=\"false\" android:screenOrientation=\"sensorLandscape\" android:configChanges=\"orientation|screenSize|screenLayout|keyboardHidden\" />\n    </application>')
              if 'android:extractNativeLibs' not in m:
                  m = m.replace('<application', '<application\n        android:extractNativeLibs=\"true\"')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(m)
              print('✓ Verified AndroidManifest.xml')
          "

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ajiptv.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ajiptv.p12" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK with VLC Optimized Config
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug -PvlcVer=3.6.0 --stacktrace || bash ci-build.sh

      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk AJIPTV.apk
          cp admin/build/outputs/apk/debug/admin-debug.apk AJIPTV-Admin.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: AJIPTV-apk
          path: AJIPTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AJIPTV-Admin-apk
          path: AJIPTV-Admin.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AJIPTV v${{ github.run_number }}
          files: AJIPTV.apk
          make_latest: true
