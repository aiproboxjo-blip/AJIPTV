name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o project.zip
      - name: Fix FFmpeg Loader & 16-bit PCM
        shell: bash
        run: |
          python3 -c "
          import os

          # 1. Preload FFmpeg libraries in MainActivity so Android TV Box linker finds them
          main_path = 'app/src/main/java/com/aj/iptv/MainActivity.kt'
          if os.path.exists(main_path):
              with open(main_path, 'r', encoding='utf-8') as f:
                  m = f.read()
              preload_code = '''
              // Preload FFmpeg dependencies in correct order for older Android TV boxes
              for (lib in listOf(\"avutil\", \"swresample\", \"avcodec\", \"ffmpegJNI\")) {
                  try { System.loadLibrary(lib) } catch (_: Throwable) {}
              }
              '''
              if 'avutil' not in m:
                  m = m.replace('super.onCreate(savedInstanceState)', 'super.onCreate(savedInstanceState)\n' + preload_code)
                  with open(main_path, 'w', encoding='utf-8') as f:
                      f.write(m)
                  print('✓ Injected library preloading into MainActivity.kt')

          # 2. Fix AjPlayer.kt: preload + force 16-bit PCM output for all TV boxes
          player_path = 'app/src/main/java/com/aj/iptv/player/AjPlayer.kt'
          if os.path.exists(player_path):
              with open(player_path, 'r', encoding='utf-8') as f:
                  p = f.read()
              p = p.replace('enableFloatOutput = true', 'enableFloatOutput = false')
              p = p.replace('setEnableFloatOutput(true)', 'setEnableFloatOutput(false)')
              p = p.replace('EXTENSION_RENDERER_MODE_ON', 'EXTENSION_RENDERER_MODE_PREFER')
              p = p.replace('ffPrefer: Boolean = false', 'ffPrefer: Boolean = true')
              p = p.replace('.setPreferredAudioMimeTypes(MimeTypes.AUDIO_AAC, MimeTypes.AUDIO_MPEG)', '')
              with open(player_path, 'w', encoding='utf-8') as f:
                  f.write(p)
              print('✓ Fixed AjPlayer.kt (16-bit PCM & PREFER mode)')

          # 3. Ensure native libraries are extracted properly
          manifest_path = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8') as f:
                  mf = f.read()
              if 'android:extractNativeLibs' not in mf:
                  mf = mf.replace('<application', '<application\n        android:extractNativeLibs=\"true\"')
                  with open(manifest_path, 'w', encoding='utf-8') as f:
                      f.write(mf)
                  print('✓ Injected extractNativeLibs in AndroidManifest.xml')

          # 4. Packaging in app/build.gradle.kts
          gradle_path = 'app/build.gradle.kts'
          if os.path.exists(gradle_path):
              with open(gradle_path, 'r', encoding='utf-8') as f:
                  g = f.read()
              if 'media3-ffmpeg-decoder' not in g:
                  g = g.replace('dependencies {', 'dependencies {\n    implementation(\"org.jellyfin.media3:media3-ffmpeg-decoder:1.3.1+1\")')
              if 'useLegacyPackaging' not in g:
                  g = g.replace('android {', 'android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }')
              with open(gradle_path, 'w', encoding='utf-8') as f:
                  f.write(g)
              print('✓ Verified app/build.gradle.kts')
          "
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ajiptv.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ajiptv.p12" >> "$GITHUB_ENV"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash ci-build.sh
      - run: |
          cp app/build/outputs/apk/debug/app-debug.apk AJIPTV.apk
          cp admin/build/outputs/apk/debug/admin-debug.apk AJIPTV-Admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AJIPTV-apk
          path: AJIPTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AJIPTV-Admin-apk
          path: AJIPTV-Admin.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AJIPTV v${{ github.run_number }}
          files: AJIPTV.apk
          make_latest: true
